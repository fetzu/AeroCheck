name: Update Releases Page

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  update-releases:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Fetch releases and generate changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fetch all releases from the GitHub API
          releases=$(gh api repos/${{ github.repository }}/releases --jq '.')

          # Generate the changelog markdown
          cat > _pages/changelog.md << 'HEADER'
          ---
          layout: page
          title: Releases
          include_in_header: true
          ---

          # Release History

          All notable changes to AéroCheck are documented here. For full details, visit the [GitHub Releases page](https://github.com/${{ github.repository }}/releases).

          <br>

          HEADER

          # Process each release
          # - First release (index 0) gets "Latest" badge
          # - Version 1.0.0 gets "Initial Release" badge (matched by tag_name, not array position)
          # This ensures v1.0.0 is always tagged correctly regardless of how many new releases are added
          echo "$releases" | jq -r '
            to_entries | .[] |
            if .key == 0 then
              "### `Latest`\n# **Version \(.value.tag_name)** - \(.value.name | split(" - ") | if length > 1 then .[1] else "" end)\n*Released \(.value.published_at | split("T")[0] | strptime("%Y-%m-%d") | strftime("%B %d, %Y"))*\n\n\(.value.body | gsub("\\r\\n"; "\n") | gsub("##"; "###"))\n\n[Full Changelog](\(.value.html_url))\n\n<br>\n\n________\n\n<br>\n"
            elif (.value.tag_name == "1.0.0") then
              "### `Initial Release`\n## **Version \(.value.tag_name)** - \(.value.name | split(" - ") | if length > 1 then .[1] else "" end)\n*Released \(.value.published_at | split("T")[0] | strptime("%Y-%m-%d") | strftime("%B %d, %Y"))*\n\n\(.value.body | gsub("\\r\\n"; "\n") | gsub("##"; "###"))\n\n[Full Changelog](\(.value.html_url))\n\n<br>\n"
            else
              "## **Version \(.value.tag_name)** - \(.value.name | split(" - ") | if length > 1 then .[1] else "" end)\n*Released \(.value.published_at | split("T")[0] | strptime("%Y-%m-%d") | strftime("%B %d, %Y"))*\n\n\(.value.body | gsub("\\r\\n"; "\n") | gsub("##"; "###"))\n\n[Full Changelog](\(.value.html_url))\n\n<br>\n"
            end
          ' >> _pages/changelog.md

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if there are changes
          if git diff --quiet _pages/changelog.md; then
            echo "No changes to commit"
            exit 0
          fi

          git add _pages/changelog.md
          git commit -m "docs: auto-update releases page

          Updated from latest GitHub releases.

          [skip ci]"
          git push

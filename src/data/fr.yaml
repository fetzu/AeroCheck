lang: "fr"
meta:
  title: "AéroCheck · Le cockpit guidé par la checklist, pour les pilotes VFR"
  description: "Un cockpit guidé par la checklist pour les pilotes VFR, sur un iPad sur la planchette et sur l'iPhone : il suit le vol de la vérification prévol à l'arrêt moteur, dit quelle vérification est à faire, et garde la carte, la route et le carnet à portée de doigt. Gratuit avec un avion."
brand: "AéroCheck"

nav:
  features: "Fonctionnalités"
  story: "Un vol"
  aircraft: "Aéronefs"
  manual: "Manuel"
  changelog: "Journal"
  download: "Télécharger"

# Le badge App Store : le visuel d'Apple (public/assets/badges), le lien dans src/lib/site.ts (APP_STORE_URL).
store: { alt: "Télécharger AéroCheck dans l'App Store", cta: "Télécharger AéroCheck" }
# Le bouton clair/sombre de la barre : ce que fait un toucher.
theme: { to_dark: "Passer au thème sombre", to_light: "Passer au thème clair" }

hero:
  eyebrow: "Pour les pilotes VFR · iPad et iPhone"
  title: "Conçu pour la planchette."
  subtitle: "AéroCheck est un cockpit guidé par la checklist, pour les pilotes VFR. Il suit le vol de la vérification prévol à l'arrêt moteur, ouvre la vérification qui est à faire, et garde la carte, la route et le carnet à portée de doigt. Gratuit avec un avion."
  secondary: { label: "Suivre un vol réel", href: "/fr/flight" }
  facts: "16 phases · {total} avions · français et anglais · open source"
  shot: "cockpit"
  shot_alt: "Le cockpit en croisière sur un iPad"
  callouts:
    - { side: "left", x: 2.5, y: 5.7,  where: "En haut",        title: "Où vous en êtes",      text: "La vérification en cours, le temps de vol et le GPS." }
    - { side: "right", x: 97, y: 15, where: "Juste dessous",  title: "Ce que vous pilotez",  text: "Vitesse sol, altitude, route, et le chemin jusqu'au prochain point." }
    - { side: "left", x: 2.5, y: 27.3, where: "Sous les chiffres", title: "Qui appeler",      text: "La fréquence à utiliser maintenant, et la suivante." }
    - { side: "right", x: 97, y: 67, where: "Au milieu",      title: "L'élément en cours",   text: "Encadré là où il se trouve, le reste de la vérification autour." }
    - { side: "left", x: 2.5, y: 94.3, where: "En bas",         title: "Quatre boutons",       text: "Sous le pouce, à la même place dans chaque phase." }

dryrun:
  band: "VOL À BLANC · 4×"
  title: "Votre premier vol avec AéroCheck, au sol."
  text: "Une fois l'app sur votre iPad ou votre iPhone, son vol à blanc vous fait faire tout un vol à votre bureau : une histoire guidée en quatre parties, de la préparation au carnet, dans le vrai cockpit. Ensuite, la pratique libre : des tours de piste sur tout aérodrome doté d'une piste, ou l'une de vos routes. Rien n'en est conservé, et la position n'est pas nécessaire."
  link: { label: "Comment marche le vol à blanc", href: "/manual#vol-à-blanc" }
  shot: "dryrun"
  alt: "Un vol à blanc guidé en première finale, sur un iPhone"

# Les quatre chapitres d'un vol dans l'app. VOLER est le cœur, rempli du cyan du poste de pilotage.
chapters:
  heading: "Un vol, quatre chapitres"
  items:
    - { key: "plan",    name: "Planifier", line: "Où, quand, quel avion, et une route qui se vérifie toute seule." }
    - { key: "prepare", name: "Préparer",  line: "La météo, les NOTAM, le plan de vol ATC et les règles de frontière, en liste à cocher." }
    - { key: "fly",     name: "Voler",     line: "Un seul écran de cockpit : la vérification à faire, la carte ou la route.", core: true }
    - { key: "close",   name: "Clôturer",  line: "Clôturer le plan de vol ATC ; la ligne du carnet est déjà écrite." }
  story: { label: "Suivre un vrai vol, de Bressaucourt à Samedan", href: "/flight" }

# Les rangées `fly: true` forment la bande VOLER, suivie de la bande iPhone (`phone`).
flagship:
  heading: "Un vol, du début à la fin"
  items:
    - step: "01 · Planifier"
      anchor: "plan"
      title: "Un vol, pas seulement une route"
      description: "Planifier un vol demande quand et d'où, et construit le reste autour. L'éditeur de route trace le profil au-dessus du relief et liste chaque espace aérien traversé, à l'altitude prévue."
      facts: ["Relief et espaces aériens vérifiés pendant le tracé", "Des voyages avec escales", "Le carburant à bord d'un tap"]
      shot: "route"
    - step: "02 · Préparer"
      anchor: "prepare"
      title: "Tout ce que vous garderiez sinon en tête"
      description: "La météo, les NOTAM, le plan de vol ATC et les règles de frontière deviennent des tâches à cocher, chacune avec son lien. L'anneau ne dit prêt que lorsqu'elles sont toutes faites."
      facts: ["Un rappel la veille", "Les règles de frontière de six pays", "Un log de nav A5 pour la planchette"]
      shot: "prepare"
    - step: "03 · Voler"
      anchor: "fly"
      fly: true
      title: "Des vérifications qui viennent à vous"
      description: "Le vol dit quand une vérification est à faire : la montée après le décollage, la croisière à la mise en palier, l'approche à cinq milles. Une vérification dépassée est marquée en retard, pas oubliée, et les remises de gaz, posés-décollés et atterrissages sont enregistrés d'eux-mêmes, avec annulation."
      facts: ["Les éléments reportés restent en vue", "Masquer les éléments mémoire pour vous tester", "V-SPEEDS et les briefings s'ouvrent par-dessus la page"]
      note: "AéroCheck accompagne la checklist approuvée de votre avion et l'AFM, et ne remplace ni l'une ni l'autre : la checklist papier reste à bord."
      shot: "vspeeds"
      iphone_shot: "cockpit"
    - step: "03 · Voler"
      fly: true
      title: "La carte, avec les tours de piste"
      description: "En route, la page passe à la carte : l'avion, la route et les espaces aériens, avec MARQUER et Dérouter sous le pouce. Autour des aérodromes, les tours de piste, les secteurs d'arrivée et les routes VFR d'open flightmaps, avec un lien vers la carte officielle."
      facts: ["Cartes OACI et vol à voile suisses, hors ligne", "Tours de piste et routes VFR dans 22 pays", "Liens vers les cartes officielles dans 18 pays"]
      shot: "circuits"
      iphone_shot: "cockpitmap"
    - step: "04 · Clôturer"
      anchor: "close"
      title: "Posé. Place au carnet."
      description: "Le rappel de clôturer votre plan de vol ATC arrive après l'atterrissage, et seulement si vous en avez déposé un. Les heures bloc et de vol viennent de la trace, et la ligne du carnet est rédigée selon les règles de l'EASA, dans les colonnes de votre propre carnet."
      facts: ["Export CSV et extrait PDF", "Ce que le vol a coûté", "Mode élève-pilote : double commande, l'instructeur comme commandant de bord"]
      shot: "closeout"
      iphone_shot: "log"

phone:
  step: "03 · Voler · iPhone"
  title: "Le même cockpit sur l'iPhone"
  description: "Dimensionné pour un téléphone à bout de bras : les mêmes trois pages et un mot par bouton sous le pouce. En mode paysage, les commandes passent dans une colonne et la carte prend le reste. À côté d'un iPad, l'iPhone devient un second écran qui le suit, et donne son GPS à un iPad Wi-Fi."
  shots: ["cockpitmap", "landscape"]

pricing:
  heading: "Ce que ça coûte"
  tiers:
    - { name: "Gratuit", title: "Tout, avec un avion", text: "Toutes les fonctions de l'app, avec la checklist de l'Aerospool WT9 Dynamic." }
    - { name: "AéroCheck Pro", title: "Tous les avions de club", text: "Les checklists des {premium} autres avions : au mois, ou à l'année avec une semaine d'essai gratuite pour les comptes éligibles.", highlight: true }
    - { name: "À vie", title: "Un seul paiement", text: "AéroCheck Pro pour de bon, en un achat unique via votre compte Apple." }
  send: "AéroCheck a commencé avec trois aéroclubs suisses, à Porrentruy, Lausanne et Neuchâtel. Les clubs et les pilotes nous envoient leurs checklists, et de nouveaux avions arrivent régulièrement : si le vôtre manque encore, envoyez-le depuis l'app ou depuis ce site."
  links:
    - { label: "Voir les avions", href: "/aircraft" }
    - { label: "Envoyer une checklist", href: "/send" }

faq:
  heading: "Questions"
  items:
    - q: "Remplace-t-il ma checklist papier ?"
      a: "Non. AéroCheck accompagne la checklist approuvée de votre avion, l'AFM et votre propre jugement, et ne remplace aucun des trois. La checklist papier reste à bord."
    - q: "Mon avion y est-il ?"
      a: "{total} avions aujourd'hui, pour la plupart de flottes de clubs suisses ; la page Aéronefs les liste. Si le vôtre manque, envoyez sa checklist depuis l'app ou depuis aerocheck.app/fr/send : de nouveaux avions arrivent régulièrement."
    - q: "Fonctionne-t-il hors de Suisse ?"
      a: "Oui. Les espaces aériens des pays où vous volez, les tours de piste et routes VFR dans 22 pays, les liens vers les cartes officielles dans 18. Les cartes suisses, la DABS et le GAFOR sont des plus pour la Suisse."
    - q: "Fonctionne-t-il sans connexion ?"
      a: "Oui. Cartes, espaces aériens et aérodromes restent sur l'appareil : téléchargez-les avant de voler."
    - q: "Qu'apporte l'iPhone ?"
      a: "Seul, l'iPhone offre le même cockpit, adapté à l'écran d'un téléphone. Associé à un iPad en mode compagnon, il devient un second écran qui suit le vol de l'iPad, et vous pouvez cocher les points sur l'un comme sur l'autre. Si votre iPad est un modèle Wi-Fi, sans GPS, l'iPhone lui prête aussi sa position. Le mode compagnon demande iOS 26 sur les deux appareils."
    - q: "Que deviennent mes données ?"
      a: "Vos vols et vos traces restent sur votre appareil et dans votre propre iCloud. Pas de compte, pas de publicité, pas de pistage ; la politique de confidentialité donne le détail."

also:
  label: "Aussi"
  items: ["Apple Watch", "Mode compagnon, iPad et iPhone ensemble", "Liens vers les taxes d'atterrissage de {tariffs} aérodromes", "Jour, nuit et contraste au soleil", "Composé en B612, la police des cockpits Airbus", "Accessibilité", "Open source (MIT) sur GitHub"]

# La page du vol (/fr/flight) : un vrai vol, de Bressaucourt à Samedan sur F-HVXA, capturé à partir de sa propre trace.
story:
  meta:
    title: "Un vol"
    description: "Un vrai vol à travers les Alpes, de Bressaucourt à Samedan en WT9 Dynamic, de la veille à la ligne du carnet, avec AéroCheck sur la planchette."
  eyebrow: "Un vol · de Bressaucourt à Samedan · F-HVXA"
  title: "La checklist qui suit votre vol."
  subtitle: "Un vrai vol à travers les Alpes en WT9 Dynamic, de la veille à la ligne du carnet, avec AéroCheck sur la planchette."
  secondary: { label: "Retour aux fonctionnalités", href: "/#features" }
  prologue:
    band: "VOL À BLANC · 4×"
    title: "Avant votre premier vol avec lui, faites-en un au sol."
    text: "Une fois l'app installée : un vol guidé en quatre parties, de la préparation au carnet, dans le vrai cockpit, à votre bureau. Ensuite, la pratique libre : des tours de piste sur tout aérodrome, une remise de gaz en deuxième finale. Rien n'en est conservé."
    link: { label: "Comment marche le vol à blanc", href: "/manual#vol-à-blanc" }
    shot: "dryrun"
    alt: "Un vol à blanc guidé en première finale, sur un iPad"
  moments:
    - when: "La veille"
      sub: "À la maison"
      chapter: "Planifier"
      title: "Tracer la route, voir ce qu'elle traverse."
      text: "De Bressaucourt à Samedan par le Grimsel et la Furka : 26 points, 173 NM, 1 h 47. Le profil montre le relief sous les altitudes prévues, et l'éditeur liste chaque espace aérien que la route traverse."
      shot: "route"
      alt: "L'éditeur de route, de Bressaucourt à Samedan"
    - when: "Le matin"
      sub: "Avant de partir"
      chapter: "Préparer"
      title: "Dix sur douze, et les NOTAM encore à lire."
      text: "La météo, la DABS, le GAFOR, les règles de frontière pour la France et l'Italie, le plan de vol ATC : chacun une tâche avec son lien, cochée au fil de la préparation. L'anneau ne dit prêt que lorsque les douze sont faites."
      shot: "prepare"
      alt: "La page du vol, 10 sur 12 faites"
    - when: "0:16"
      sub: "Aligné, piste 07"
      chapter: "Voler"
      fly: true
      title: "Alignement fait. La montée attend le décollage."
      text: "Chaque vérification depuis le prévol, un élément à la fois. Sur la piste, SUIVANT désigne DEKAM et le bouton affiche APRÈS LE DÉCOLLAGE : la vérification de montée arrive une fois le décollage détecté."
      shot: "lineup"
      alt: "Le cockpit aligné à Bressaucourt"
    - when: "0:31"
      sub: "Au-dessus du lac de Bienne"
      chapter: "Voler"
      fly: true
      title: "Les points tournants se marquent d'eux-mêmes."
      text: "BENOT est marqué au passage de l'avion, avec Annuler pendant six secondes. La radio est passée à Genève Info ; la tour de Samedan est déjà la suivante."
      shot: "automark"
      alt: "BENOT marqué automatiquement, la vérification de croisière ouverte"
    - when: "1:04"
      sub: "En montée vers le Grimsel"
      chapter: "Voler"
      fly: true
      title: "La carte, la route et le col suivant."
      text: "En croisière, la page passe à la carte : la route par-dessus les cols, le prochain point et son heure, MARQUER et le chrono sous le pouce."
      shot: "alps"
      alt: "La carte du cockpit au-dessus des Alpes"
    - when: "1:53"
      sub: "Au-dessus de Saint-Moritz"
      chapter: "Voler"
      fly: true
      title: "La vérification d'approche, sans rien demander."
      text: "En descente vers l'Engadine, la vérification d'approche arrive d'elle-même : la case de vérification passe à l'ambre, six éléments à faire. La fréquence active est la tour de Samedan, et SUIV reste vide."
      shot: "approach"
      alt: "La vérification d'approche près de Samedan"
    - when: "Moteur coupé"
      sub: "Samedan"
      chapter: "Clôturer"
      title: "Clôturer le plan de vol. La ligne du carnet est déjà écrite."
      text: "Le rappel de clôturer le plan de vol ATC reste rouge tant que ce n'est pas fait. Les heures bloc et de vol viennent de la trace, les heures moteur des deux relevés d'horamètre saisis."
      shot: "closeout"
      alt: "La clôture du vol à Samedan"
    - when: "Plus tard"
      sub: "Dans le carnet"
      chapter: "Clôturer"
      title: "Tout le vol, dans le carnet."
      text: "La trace au-dessus des Alpes, le profil d'altitude, chaque événement de la chronologie avec son heure, et la ligne pour votre carnet papier."
      shot: "log"
      alt: "Le vol dans le carnet"
  end:
    title: "Votre prochain vol, sur votre planchette."
    text: "Gratuit avec le WT9 Dynamic, tous les avions de club avec AéroCheck Pro."
    secondary: { label: "Lire le manuel", href: "/manual" }


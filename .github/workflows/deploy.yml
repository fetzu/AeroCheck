name: Deploy website (Astro → Pages)

# Builds the Astro site and deploys it to GitHub Pages on every push to `website` (the site's prod
# branch) and on manual dispatch.
#
# REQUIRES (one-time): repo Settings → Pages → Build and deployment → Source → "GitHub Actions"
# (switches off the old Jekyll gh-pages source). Until that's set the final deploy step fails — the
# build still runs, so it's safe; just flip the setting and re-run / push again.
#
# Note: a workflow_dispatch "Run workflow" button only appears when the file is on the repo's
# DEFAULT branch (main). Since this lives on `website`, the push trigger below is what actually runs it.

on:
  push:
    branches: [website]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Lets the build-time GitHub fetches (footer version, changelog) use the authenticated
          # rate limit (5000/hr) instead of the anonymous 60/hr shared across Actions runner IPs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

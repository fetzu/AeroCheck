lang: "fr"
meta:
  title: "AéroCheck — Checklists, navigation et planification de vol pour pilotes"
  description: "Votre copilote numérique pour les checklists, la navigation, la planification de vol et le carnet de vol — pour élèves-pilotes et pilotes privés, du prévol à l'arrêt moteur."
brand: "AéroCheck"

nav:
  features: "Fonctionnalités"
  aircraft: "Aéronefs"
  manual: "Manuel"
  changelog: "Journal"
  download: "Télécharger"

hero:
  eyebrow: "Toujours une longueur d'avance"
  title: "Votre copilote numérique, à chaque phase du vol."
  subtitle: "Checklists interactives, cartes plein écran, planification sur la carte et carnet de vol automatique — pour élèves-pilotes et pilotes privés, du prévol à l'arrêt moteur."
  primary: { label: "Obtenir sur GitHub", href: "https://github.com/fetzu/AeroCheck/releases", icon: "brand-github" }
  secondary: { label: "Lire le manuel", href: "/fr/manual", icon: "book-2" }
  cycle_caption: "défile automatiquement : HUD · nav · plan · journal"
  cycle: ["hudhero", "nav", "planning", "log"]

flagship:
  heading: "Un vol, du début à la fin"
  items:
    - step: "01 · Planifier"
      title: "Construisez la route en glissant sur la carte"
      description: "Déplacez un waypoint, tirez la ligne pour en insérer un, relâchez près d'un aérodrome pour accrocher automatiquement son nom et sa fréquence. Un profil de route en direct signale la marge de terrain et détecte les conflits d'espace aérien tout au long."
      chips: ["From→To d'abord", "Glisser-déposer & accrochage", "Détection conflits terrain & espace", "OpenAIP · 119 pays", "Export GPX"]
      shot: "planning"
    - step: "02 · Voler"
      title: "La bonne étape de checklist, au bon moment"
      description: "L'élément en cours devient le centre tandis que les étapes passées et futures s'effacent ; un bandeau d'instruments affiche vitesse, altitude et cap avec une barre « dans la cible », sur les 16 phases. Temps moteur, temps-bloc, remises de gaz, touch-and-gos et atterrissages sont détectés et journalisés automatiquement."
      chips: ["16 phases", "16 aéronefs", "Bandeau « dans la cible »", "Briefings départ & approche", "Mode tour de piste", "Détection auto remise de gaz / touch-and-go / atterrissage"]
      shot: "hud"
    - step: "03 · Naviguer"
      title: "Cartes plein écran, fréquences à portée"
      description: "Cartes OACI suisses, vectoriel & satellite Apple, et une couche d'espaces aériens OpenAIP mondiale, avec aérodromes, balises, obstacles et points de report VFR à portée. Chronométrage par tronçon, vecteur de tendance de route sol, rappel FREDA et panneau de fréquences ACTUELLE / SUIVANTE / URGENCE — cache par continent ou diffusion en direct des espaces proches."
      chips: ["OACI / Segelflug", "Vectoriel & satellite Apple", "Espaces OpenAIP", "Aérodromes, balises & points de report", "ACTUELLE / SUIVANTE / URGENCE", "Rappel FREDA", "Hors ligne par continent", "Diffusion espaces en direct"]
      shot: "nav"
    - step: "04 · Journal"
      title: "Chaque vol, enregistré automatiquement"
      description: "Une trace GPS complète avec profil de vitesse et d'altitude, les temps moteur, bloc, alignement et atterrissage automatiques, et un carnet de vol clair à filtrer, rejouer et partager. Export GPX, JSON ou ZIP pour vos archives ou votre avionique."
      chips: ["Trace GPS & profil d'altitude", "Historique & statistiques", "Filtrer & rejouer", "Cartes de partage", "Export GPX / JSON / ZIP"]
      shot: "log"

supporting:
  heading: "Tout le reste"
  items:
    - title: "AéroCheck Pro"
      description: "Le WT9 Dynamic est gratuit ; les 15 autres aéronefs se débloquent avec AéroCheck Pro — un abonnement avec essai gratuit de 7 jours, ou un achat unique à vie. Bientôt sur l'App Store."
      icon: "sparkles"
    - title: "Mode Compagnon"
      description: "Associez un iPad et un iPhone via Wi-Fi Aware pour un second écran synchronisé — basculez entre carte et checklist, pilotez l'un depuis l'autre. Un iPad en Wi-Fi seul peut même voler grâce au GPS de l'iPhone."
      icon: "devices"
    - title: "Briefings départ & approche"
      description: "Briefings dynamiques avec vitesses de référence, procédures d'urgence et détection des aérodromes proches — vent et suggestions de piste selon votre position GPS."
      icon: "book-2"
    - title: "Modes apprentissage & circuit"
      description: "Masquez les éléments à mémoriser pour vous tester ; le mode circuit simplifie le tour de piste avec suivi des atterrissages complets."
      icon: "school"

ecosystem:
  - { label: "16 aéronefs · 16 phases", icon: "plane" }
  - { label: "Apple Watch", icon: "clock" }

name: VFR data (weekly)

# Publishes the VFR data the app downloads from aerocheck.app/data: traffic circuits, VFR routes and reporting
# points from open flightmaps (scripts/vfrdata/extract_ofm.py) and the official-chart registry
# (scripts/vfrdata/charts_registry.py). Scripts and data both live on the `website` branch; this file lives on
# main only because GitHub runs scheduled workflows from the default branch alone.
#
# Thursdays at 05:00 UTC: AIRAC cycles take effect on Thursdays, so a new cycle is picked up the day it starts
# when open flightmaps has published it (otherwise the previous cycle stays, and next week tries again).
# A push made with GITHUB_TOKEN triggers no workflow, so the job dispatches the site's deploy.yml itself, the
# way deploy-website-on-release.yml does. Any failure or validation stop opens (or comments on) one issue,
# "VFR data job failed". No secrets: every source is public.

on:
  schedule:
    - cron: '0 5 * * 4'
  workflow_dispatch:
    inputs:
      force:
        description: Re-extract even if open flightmaps' files are unchanged (after a change to the extractor)
        type: boolean
        default: false
      allow_drop:
        description: Publish although circuits or points dropped more than 30% (only once OFM is checked)
        type: boolean
        default: false

# One run at a time: two runs would race for the same push
concurrency:
  group: vfr-data
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the data commit to `website`
      actions: write    # dispatch deploy.yml
    outputs:
      log: ${{ steps.log.outputs.excerpt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: website

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # A broken script publishes nothing
      - name: Test the scripts
        run: |
          set -o pipefail
          python3 -m unittest discover -s scripts/vfrdata 2>&1 | tee -a "$RUNNER_TEMP/vfr-data.log"

      # Both scripts keep the last good file when they stop, so a stop still lets the rest be published
      - name: open flightmaps
        id: ofm
        continue-on-error: true
        env:
          FORCE: ${{ inputs.force }}
          ALLOW_DROP: ${{ inputs.allow_drop }}
        run: |
          set -o pipefail
          args=(-v)
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          if [ "$ALLOW_DROP" = "true" ]; then args+=(--allow-drop); fi
          python3 scripts/vfrdata/extract_ofm.py "${args[@]}" 2>&1 | tee -a "$RUNNER_TEMP/vfr-data.log"

      - name: Chart registry
        id: charts
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/vfrdata/charts_registry.py -v 2>&1 | tee -a "$RUNNER_TEMP/vfr-data.log"

      - name: Commit and push what changed
        id: commit
        run: |
          git add public/data
          if git diff --cached --quiet; then
            echo "Nothing changed in public/data."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # "website: VFR data AIRAC 2611 (CH, AT, DE, CZ)": the countries whose file changed, by cycle, and
          # "charts" when the chart registry changed too
          subject=$(CHANGED="$(git diff --cached --name-only)" python3 - <<'PY'
          import json, os
          changed = os.environ["CHANGED"].split()
          regions = json.load(open("public/data/ofm/v1/index.json"))["regions"]
          cycles = {}
          for country, entry in regions.items():
              if f"public/data/ofm/v1/{country.lower()}.json" in changed:
                  cycles.setdefault(entry["airac"], []).append(country)
          groups = [[airac, countries] for airac, countries in sorted(cycles.items(), reverse=True)]
          if "public/data/charts/v1/charts.json" in changed:
              if groups:
                  groups[-1][1].append("charts")
              else:
                  groups = [[max((e["airac"] for e in regions.values()), default="?"), ["charts"]]]
          if not groups:
              groups = [[max((e["airac"] for e in regions.values()), default="?"), ["index"]]]
          print("website: VFR data AIRAC " + ", ".join(f"{airac} ({', '.join(names)})" for airac, names in groups))
          PY
          )
          {
            echo "$subject"
            echo
            echo "Weekly job: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            grep -E '^(CH|AT|DE|CZ|FR) |^charts\.json|^index\.json' "$RUNNER_TEMP/vfr-data.log" || true
          } > "$RUNNER_TEMP/message.txt"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -F "$RUNNER_TEMP/message.txt"
          # Someone may have pushed to `website` meanwhile: replay the data commit on top (never a force push)
          for attempt in 1 2 3; do
            if git push origin HEAD:website; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch origin website
            git rebase origin/website || { git rebase --abort; echo "The data commit doesn't replay on website." >&2; exit 1; }
          done
          echo "Could not push to website after three attempts." >&2
          exit 1

      - name: Deploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref website

      - name: Fail the run if a script stopped
        if: steps.ofm.outcome == 'failure' || steps.charts.outcome == 'failure'
        run: |
          echo "open flightmaps: ${{ steps.ofm.outcome }}, chart registry: ${{ steps.charts.outcome }}" >&2
          exit 1

      # The tail of the log, for the issue (whatever happened above)
      - name: Keep the log
        id: log
        if: always()
        run: |
          {
            echo "excerpt<<VFR_DATA_LOG_END"
            tail -n 80 "$RUNNER_TEMP/vfr-data.log" 2>/dev/null || echo "(no log: the job stopped before the scripts ran)"
            echo "VFR_DATA_LOG_END"
          } >> "$GITHUB_OUTPUT"

  report:
    needs: publish
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write     # open or comment on "VFR data job failed"
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          LOG: ${{ needs.publish.outputs.log }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="VFR data job failed"
          {
            echo "The weekly VFR data job stopped on $(date -u '+%Y-%m-%d %H:%M UTC'): $RUN_URL"
            echo
            echo "Whatever stopped kept its last good file on aerocheck.app (the app shows it aging). The scripts"
            echo "and how to re-run them (\`--force\`, \`--allow-drop\` from the Run workflow button) are in"
            echo "\`scripts/vfrdata/README.md\` on the \`website\` branch."
            echo
            echo '```'
            printf '%s\n' "$LOG"
            echo '```'
          } > "$RUNNER_TEMP/issue.md"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
            --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label bug --assignee fetzu \
              --body-file "$RUNNER_TEMP/issue.md"
          fi

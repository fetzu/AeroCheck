name: Deploy website (Astro → Pages)

# Builds the Astro site and deploys it to GitHub Pages on every push to `website` (the site's prod
# branch) and on manual dispatch. Pages is already on the "GitHub Actions" source (gh-pages/Jekyll is
# fully retired — DOC9-DATA-08).
#
# Note: a workflow_dispatch "Run workflow" button only appears when the file is on the repo's
# DEFAULT branch (main). Since this lives on `website`, the push trigger below is what actually runs it.

on:
  push:
    branches: [website]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Lets the build-time GitHub fetches (footer version, changelog) use the authenticated
          # rate limit (5000/hr) instead of the anonymous 60/hr shared across Actions runner IPs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Lets the build read the landing-fee registry count (`X-AeroCheck-Client`). The value is a
          # repo secret and must ALSO be listed in the server's APP_CLIENT_SECRETS (it is a rotatable
          # list — give the site its own entry). Absent, the build falls back to the last-known count
          # with a warning; it never fails.
          AEROCHECK_CLIENT: ${{ secrets.AEROCHECK_CLIENT }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

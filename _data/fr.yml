# App Info
page_title: "AéroCheck - Application de Checklist, Navigation et Planification de Vol"
app_name: "AéroCheck"
app_price: "Gratuit (Open Source)"
app_description: "Votre copilote numérique pour les checklists, la navigation et la planification de vol — entièrement repensé en 4.0, pensé d'abord pour l'iPad. Pour les élèves-pilotes comme pour les pilotes privés expérimentés."

# Features
features:
  - title: "Cockpit en Vol Redesigné"
    description: "Une refonte complète, pensée d'abord pour l'iPad. L'élément de checklist en cours devient l'élément principal tandis que les étapes passées et futures s'effacent ; un bandeau d'instruments affiche vitesse, altitude, cap et vitesse verticale avec une barre « dans la cible », et une barre de phases tactile permet de parcourir les 16 phases. Remise des gaz, touch-and-go et arrêt complet sont protégés par un appui maintenu."
    fontawesome_icon_name: "tachometer-alt"

  - title: "Planification sur Carte"
    description: "Construisez vos routes directement sur la carte : déplacez un waypoint, tirez la ligne pour en insérer un, et relâchez près d'un aérodrome pour un accrochage automatique de son nom et de sa fréquence. Un profil de route interactif montre la marge de terrain et les conflits d'espace aérien pendant la planification. Exportez en GPX pour Dynon, Garmin et autres MFD."
    fontawesome_icon_name: "route"

  - title: "Mode Compagnon"
    description: "Associez un iPhone comme second écran synchronisé de votre iPad via Wi-Fi Aware, reflétant vos données de vol en temps réel sur un second appareil. (Nécessite iOS 26 sur les deux appareils.)"
    fontawesome_icon_name: "tablet-alt"

  - title: "Thèmes Cockpit"
    description: "Un moteur de thèmes sélectionnable — Auto, Jour, Plein soleil ou Nuit — optimisé pour la lisibilité, du plein jour au cockpit sombre. Le mode Auto suit l'apparence de votre système."
    fontawesome_icon_name: "adjust"

  - title: "16 Phases de Vol"
    description: "Couverture complète du Preflight au Hangar. Naviguez à travers toutes les phases avec un guidage étape par étape."
    fontawesome_icon_name: "clipboard-check"

  - title: "Support Multi-Aéronef"
    description: "WT9 Dynamic inclus gratuitement, plus 12 aéronefs premium de deux aéroclubs suisses. Checklists, vitesses et limites s'adaptent automatiquement à l'aéronef sélectionné."
    fontawesome_icon_name: "plane"

  - title: "Navigation Interactive"
    description: "Carte plein écran avec cartes OACI suisses, chronométrage par tronçon, vecteur de tendance de route sol, rappel de croisière FREDA et panneau de fréquences ACTUELLE / SUIVANTE / URGENCE. Mise en cache des cartes pour utilisation hors ligne."
    fontawesome_icon_name: "map"

  - title: "Suivi GPS & Journal de Vol"
    description: "Enregistre votre trajectoire avec vitesse sol et altitude en temps réel, et continue l'enregistrement en arrière-plan -- avec des alertes à l'écran si le GPS ou l'accès en arrière-plan est interrompu. Chronométrage automatique du démarrage moteur, alignement, atterrissage et arrêt moteur. Exportez vos vols en GPX, JSON ou ZIP."
    fontawesome_icon_name: "location-arrow"

  - title: "Données Aéronautiques Mondiales"
    description: "Couche d'espaces aériens OpenAIP couvrant 119 pays. Téléchargez les données par continent pour l'utilisation hors ligne ou recevez les espaces contrôlés à proximité en temps réel."
    fontawesome_icon_name: "globe-europe"

  - title: "Briefings Départ & Approche"
    description: "Briefings dynamiques avec vitesses de référence, procédures d'urgence et détection des aérodromes à proximité. Données de vent et suggestions de piste basées sur votre position GPS."
    fontawesome_icon_name: "book-open"

  - title: "Modes Apprentissage & Circuit"
    description: "Masquez les éléments à mémoriser pour tester vos connaissances. Le mode circuit simplifie le travail de tour de piste avec suivi des atterrissages complets."
    fontawesome_icon_name: "graduation-cap"

  - title: "Application Apple Watch"
    description: "Suivez votre vol depuis votre poignet avec phase, vitesse et altitude en temps réel -- avec un avertissement clair si les données deviennent obsolètes."
    fontawesome_icon_name: "clock"

  - title: "Accessibilité"
    description: "Étiquettes VoiceOver, Dynamic Type, couleurs à fort contraste, grandes zones tactiles de 44 points et prise en charge de Réduire les animations sur les écrans redesignés."
    fontawesome_icon_name: "universal-access"

  - title: "Synchronisation iCloud"
    description: "Les paramètres et l'historique des vols se synchronisent automatiquement sur tous vos appareils, en fusionnant les vols plutôt qu'en les écrasant."
    fontawesome_icon_name: "cloud"

  - title: "Open Source"
    description: "Développé avec Swift et SwiftUI. Contribuez sur GitHub ou adaptez-le pour votre propre aéroclub."
    fontawesome_icon_name: "code-branch"


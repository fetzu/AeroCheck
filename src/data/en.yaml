lang: "en"
meta:
  title: "AéroCheck — Plan, prepare, fly and close every flight"
  description: "Plan the route, prepare the admin, fly the 16-phase checklist, close out the logbook. AéroCheck follows every flight from the idea to the last line in your logbook — for student and private pilots."
brand: "AéroCheck"

nav:
  features: "Features"
  aircraft: "Aircraft"
  manual: "Manual"
  changelog: "Changelog"
  download: "Download"

hero:
  eyebrow: "Plan it. Prepare it. Fly it. Close it."
  title: "The whole flight, in one place."
  subtitle: "From the first idea to the last line in your logbook: a route, the admin around it, the 16-phase checklist in the cockpit, and the close-out afterwards — followed as one flight, not four apps."
  primary: { label: "Get it on GitHub", href: "https://github.com/fetzu/AeroCheck/releases", icon: "brand-github" }
  secondary: { label: "Read the manual", href: "/manual", icon: "book-2" }
  cycle_caption: "auto-cycles: flight · HUD · nav · close-out"
  cycle: ["flight", "hudhero", "nav", "closeout"]

# The four chapters a flight has in the app, drawn as the app draws them. FLY is the core.
chapters:
  heading: "A flight has four chapters"
  items:
    - { key: "plan",    name: "Plan",    line: "Where, when, which aircraft — and a route that checks itself." }
    - { key: "prepare", name: "Prepare", line: "Weather, NOTAMs, the flight plan filed, the border pack, the nav log." }
    - { key: "fly",     name: "Fly",     line: "Sixteen phases, one step at a time, with the charts one tap away.", core: true }
    - { key: "close",   name: "Close",   line: "Close the flight plan, write the logbook line, know what it cost." }

flagship:
  heading: "A flight, start to finish"
  items:
    - step: "01 · Plan"
      anchor: "plan"
      title: "A flight, not just a route"
      description: "Plan new flight asks for the two things you know first — when, and where from — and builds the rest around them. Start from a saved route or draw one on the map; waypoints take the field's own elevation; the fuel plan is checked against the route as either changes. Several stops become a trip with one preparation shared across its legs."
      chips: ["Plan new flight", "Routes as a library", "Drag-to-build map", "Terrain & airspace conflicts", "Fuel plan, checked live", "Mass & balance", "Multi-leg trips"]
      shot: "flight"
    - step: "02 · Prepare"
      anchor: "prepare"
      title: "Everything you would otherwise keep in your head"
      description: "Weather, DABS and GAFOR, NOTAMs, the ICAO flight plan copied and ready to file, PPR raised from the airfield data, a border pack for the neighbouring countries, an A5 nav log for the kneeboard — as a checklist you tick, each with its link. A reminder the day before, and a readiness ring that only says ready when everything is."
      chips: ["Weather · DABS · GAFOR · NOTAM", "ICAO FPL → skybriefing", "PPR from openAIP", "Border pack CH · FR · DE · AT · IT · GB", "A5 nav log", "T−24 h reminder"]
      shot: "prepare"
    - step: "03 · Fly"
      anchor: "fly"
      title: "The right checklist step, right now"
      description: "The active item is the hero while past and future steps recede; a cockpit instrument strip shows speed, altitude and heading with an on-target bar, across all 16 phases. Engine time, block time, go-arounds, touch-and-gos and landings are detected and logged automatically — by an engine validated against real flights, with the barometer as its altitude reference."
      chips: ["16 phases", "{total} aircraft", "On-target instrument strip", "Departure & approach briefings", "Circuit mode", "Auto go-around / touch-and-go / landing", "Barometer-assisted"]
      shot: "hud"
    - step: "03 · Fly"
      title: "Full-screen charts, frequencies in reach"
      description: "Swiss ICAO charts, Apple vector & satellite, and a worldwide OpenAIP airspace overlay with airports, navaids, obstacles and VFR reporting points on tap. Leg-by-leg timing, a ground-track trend vector, the FREDA reminder and a current / next / emergency frequency panel — cached by continent or streamed live."
      chips: ["ICAO / Segelflug", "Apple vector & satellite", "OpenAIP airspace", "Airports, navaids & reporting points", "CURRENT / NEXT / EMERG", "FREDA reminder", "Offline by continent"]
      shot: "nav"
    - step: "04 · Close"
      anchor: "close"
      title: "Landed. Now the logbook."
      description: "The one reminder with a search-and-rescue consequence — close your flight plan — arrives after landing, and only if you filed one. Then the logbook line, drafted to AMC1 FCL.050 with the times in UTC and laid out as your logbook's own columns, exportable as CSV or a PDF extract; what the flight cost; and a post-flight review of what the track saw. Student pilots log dual, with the instructor named as PIC."
      chips: ["Close-your-flight-plan reminder", "Logbook line · AMC1 FCL.050", "Logbook row & PDF extract", "Cost per flight", "Post-flight review", "Student mode"]
      shot: "closeout"

supporting:
  heading: "Everything else"
  items:
    - title: "AéroCheck Pro"
      description: "The WT9 Dynamic is free; the other {premium} aircraft unlock with AéroCheck Pro — a subscription with a 7-day free trial, or a one-time Lifetime purchase."
      icon: "sparkles"
    - title: "Companion mode"
      description: "Pair an iPad and iPhone over Wi-Fi Aware for a synced second screen — swipe between charts and checklist, and control either from either device. A Wi-Fi-only iPad can even fly on the iPhone's GPS."
      icon: "devices"
    - title: "Landing fees, at the source"
      description: "{tariffs} aerodromes in {tariffCountries} countries link straight to the page where the operator publishes its own fees — with the date it last changed. Never a number the app made up."
      icon: "receipt"
    - title: "Departure & approach briefings"
      description: "Dynamic briefings with V-speeds, emergency procedures and nearby-airport detection — wind and runway suggestions from your GPS position, worldwide."
      icon: "book-2"
    - title: "Learning & circuit modes"
      description: "Hide memorizable items to test your knowledge; circuit mode streamlines pattern work with full-stop tracking and offers the light close-out afterwards."
      icon: "school"

ecosystem:
  - { label: "{total} aircraft · 16 phases", icon: "plane" }

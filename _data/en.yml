# App Info
page_title: "AéroCheck - Flight Checklist App for Pilots"
app_name: "AéroCheck"
app_price: "Free (Open Source)"
app_description: "Your digital co-pilot for flight checklists and navigation. Designed for both student and experienced private pilots."

# Features
features:
  - title: "16 Flight Phases"
    description: "Complete coverage from Preflight to Hangar. Navigate through all phases with step-by-step checklist guidance."
    fontawesome_icon_name: "clipboard-check"

  - title: "Multi-Aircraft Support"
    description: "WT9 Dynamic included free. Additional aircraft available with a premium subscription."
    fontawesome_icon_name: "plane"

  - title: "GPS Tracking & Flight Logging"
    description: "Records your flight path with real-time ground speed and altitude, and keeps recording in the background -- with on-screen alerts if GPS or background access is interrupted. Automatic timing of engine start, line-up, landing, and shutdown. Export flights as GPX, JSON, or ZIP."
    fontawesome_icon_name: "location-arrow"

  - title: "Interactive Navigation"
    description: "Full-screen map with Swiss ICAO charts, flight planning, terrain profiles, and nearby CTR frequencies. Export your navigation plan as GPX for Dynon, Garmin, and other MFDs. Cache maps for offline use."
    fontawesome_icon_name: "map"

  - title: "Learning & Circuit Modes"
    description: "Hide memorizable items to test your knowledge. Circuit mode streamlines pattern work with full-stop tracking."
    fontawesome_icon_name: "graduation-cap"

  - title: "Apple Watch App"
    description: "Keep track of your flight from your wrist with real-time phase, speed, and altitude information -- with a clear warning if the data goes stale."
    fontawesome_icon_name: "clock"

  - title: "Dark Cockpit UI"
    description: "Designed for readability in the cockpit with large touch targets and aviation-inspired colors."
    fontawesome_icon_name: "moon"

  - title: "iCloud Sync"
    description: "Settings and flight history sync automatically across all your devices."
    fontawesome_icon_name: "cloud"

  - title: "Open Source"
    description: "Built with Swift and SwiftUI. Contribute on GitHub or adapt it for your own aeroclub."
    fontawesome_icon_name: "code-branch"

  - title: "Worldwide Airspace Data"
    description: "OpenAIP airspace overlay covering 119 countries. Download data by continent for offline use or stream nearby controlled airspace in real-time."
    fontawesome_icon_name: "globe-europe"

  - title: "Departure & Approach Briefings"
    description: "Dynamic briefings with V-speeds, emergency procedures, and nearby airport detection. Wind data and runway suggestions based on your GPS position."
    fontawesome_icon_name: "book-open"

  - title: "Flight Planning"
    description: "Plan routes with waypoints, terrain profiles, and fuel calculations. Export your navigation plan as GPX for Dynon, Garmin, and other MFDs."
    fontawesome_icon_name: "route"


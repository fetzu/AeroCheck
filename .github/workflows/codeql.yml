name: "CodeQL"

# Push and PR runs only when something CodeQL analyses can change: Swift sources, the Xcode project, the
# build settings, or this file. A docs- or workflow-only PR has nothing to analyse, and the Swift build
# takes a macOS runner. The weekly run still scans the whole tree. (If this check is ever made required,
# drop the path filters: GitHub leaves a path-skipped required check pending, which blocks the merge.)
on:
  push:
    branches: [main]
    paths:
      - '**/*.swift'
      - 'AeroCheck.xcodeproj/**'
      - '**/*.xcconfig'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.swift'
      - 'AeroCheck.xcodeproj/**'
      - '**/*.xcconfig'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-26
    permissions:
      # SEC-C42: least privilege, stated explicitly rather than inherited.
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: swift
          build-mode: manual

      - name: Build with xcodebuild
        run: |
          xcodebuild build \
            -scheme "AéroCheck" \
            -destination "generic/platform=iOS" \
            -skipPackagePluginValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCH=arm64

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:swift"

# App Info
page_title: "AéroCheck - Flight Checklist, Navigation & Planning for Pilots"
app_name: "AéroCheck"
app_price: "Free (Open Source)"
app_description: "Your digital co-pilot for flight checklists, navigation and planning — rebuilt from the ground up in 4.0, iPad-first. For student and experienced private pilots."

# Features
features:
  - title: "Redesigned In-Flight HUD"
    description: "A ground-up, iPad-first redesign. The current checklist item is the hero while past and future steps recede; a cockpit instrument strip shows speed, altitude, heading and vertical speed with an on-target bar, and a tappable phase bar jumps through all 16 phases. Go-around, touch-and-go and full-stop sit behind a deliberate hold."
    fontawesome_icon_name: "tachometer-alt"

  - title: "Map-First Flight Planning"
    description: "Build routes right on the map: drag a waypoint to move it, drag the route line to insert one, and release near an airfield to auto-snap its name and frequency. An interactive route profile shows terrain clearance and on-route airspace conflicts as you plan. Export as GPX for Dynon, Garmin and other MFDs."
    fontawesome_icon_name: "route"

  - title: "Companion Mode"
    description: "Pair an iPhone as a synced second screen for your iPad over Wi-Fi Aware, mirroring your live flight data on a second device. (Requires iOS 26 on both devices.)"
    fontawesome_icon_name: "tablet-alt"

  - title: "Cockpit Themes"
    description: "A selectable theme engine — Auto, Day, Sunlight or Night — tuned for readability from bright daylight to a dark cockpit. Auto follows your system appearance."
    fontawesome_icon_name: "adjust"

  - title: "16 Flight Phases"
    description: "Complete coverage from Preflight to Hangar. Navigate through all phases with step-by-step checklist guidance."
    fontawesome_icon_name: "clipboard-check"

  - title: "Multi-Aircraft Support"
    description: "WT9 Dynamic included free, plus 12 premium aircraft from two Swiss flying clubs. Checklists, speeds and limits adapt automatically to the selected aircraft."
    fontawesome_icon_name: "plane"

  - title: "Interactive Navigation"
    description: "Full-screen map with Swiss ICAO charts, leg-by-leg timing, a ground-track trend vector, a FREDA cruise reminder and a CURRENT / NEXT / EMERGENCY frequency panel. Cache maps for offline use."
    fontawesome_icon_name: "map"

  - title: "GPS Tracking & Flight Logging"
    description: "Records your flight path with real-time ground speed and altitude, and keeps recording in the background -- with on-screen alerts if GPS or background access is interrupted. Automatic timing of engine start, line-up, landing, and shutdown. Export flights as GPX, JSON, or ZIP."
    fontawesome_icon_name: "location-arrow"

  - title: "Worldwide Airspace Data"
    description: "OpenAIP airspace overlay covering 119 countries. Download data by continent for offline use or stream nearby controlled airspace in real-time."
    fontawesome_icon_name: "globe-europe"

  - title: "Departure & Approach Briefings"
    description: "Dynamic briefings with V-speeds, emergency procedures, and nearby airport detection. Wind data and runway suggestions based on your GPS position."
    fontawesome_icon_name: "book-open"

  - title: "Learning & Circuit Modes"
    description: "Hide memorizable items to test your knowledge. Circuit mode streamlines pattern work with full-stop tracking."
    fontawesome_icon_name: "graduation-cap"

  - title: "Apple Watch App"
    description: "Keep track of your flight from your wrist with real-time phase, speed, and altitude information -- with a clear warning if the data goes stale."
    fontawesome_icon_name: "clock"

  - title: "Accessibility"
    description: "VoiceOver labels, Dynamic Type, high-contrast colors, large 44-point touch targets and Reduce Motion support across the redesigned screens."
    fontawesome_icon_name: "universal-access"

  - title: "iCloud Sync"
    description: "Settings and flight history sync automatically across all your devices, merging flights instead of overwriting them."
    fontawesome_icon_name: "cloud"

  - title: "Open Source"
    description: "Built with Swift and SwiftUI. Contribute on GitHub or adapt it for your own aeroclub."
    fontawesome_icon_name: "code-branch"


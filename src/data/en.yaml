lang: "en"
meta:
  title: "AéroCheck · The checklist app for VFR pilots"
  description: "A checklist app for VFR pilots, on an iPad on your kneeboard or on your iPhone. It follows your flight from the pre-flight check to the shutdown, shows you which check is due, and keeps the map, the route and the logbook one tap away. Free with one aircraft."
brand: "AéroCheck"

nav:
  features: "Features"
  story: "A flight"
  aircraft: "Aircraft"
  countries: "Countries"
  manual: "Manual"
  changelog: "Changelog"
  download: "Download"

# The App Store badge: Apple's artwork (public/assets/badges), the link in src/lib/site.ts (APP_STORE_URL).
store: { alt: "Download AéroCheck on the App Store", cta: "Download AéroCheck" }
# The nav's light/dark switch: what a tap does.
theme: { to_dark: "Switch to the dark theme", to_light: "Switch to the light theme" }

hero:
  eyebrow: "For VFR pilots · iPad and iPhone"
  title: "Built for the kneeboard."
  subtitle: "AéroCheck is a checklist app for VFR pilots. It follows your flight from the pre-flight check to the shutdown, opens the check that is due, and keeps the map, the route and the logbook one tap away. Free with one aircraft."
  secondary: { label: "Follow a real flight", href: "/flight" }
  facts: "16 phases · {total} aircraft · English, German and French · open source"
  shot: "cockpit"
  shot_alt: "The Cockpit in cruise on an iPad"
  # Positions in percent of the iPad screenshot (cockpit.jpg). A label sits beside the picture; only its line crosses it.
  callouts:
    - { side: "left", x: 2.5, y: 5.0,  where: "At the top",    title: "Where you are",        text: "The current check, the flight time and the GPS." }
    - { side: "right", x: 97, y: 13.4, where: "Below it",      title: "What you are flying",  text: "Ground speed, altitude, track, and what is left to the next waypoint." }
    - { side: "left", x: 2.5, y: 23.6, where: "Under the figures", title: "Who to call",    text: "The frequency to use now, and the next one." }
    - { side: "right", x: 97, y: 56.6, where: "In the middle", title: "The item you are on",  text: "Framed in the list, with the other items around it." }
    - { side: "left", x: 2.5, y: 93.8, where: "At the bottom",   title: "Four buttons",         text: "In the same place in every phase (so you don't have to look for them)." }

dryrun:
  band: "DRY RUN · 4×"
  title: "Your first flight with AéroCheck, on the ground."
  text: "Once the app is on your iPad or iPhone, the dry run takes you through a whole flight from your desk: a guided story in four parts, from planning to the logbook, in the real Cockpit. After that, free practice: circuits at any aerodrome with a runway, or one of your routes. None of it ends up in your logbook, and you don't even have to leave your chair."
  link: { label: "How the dry run works", href: "/manual#dry-run" }
  shot: "dryrun"
  alt: "A guided dry run on its first final, on an iPhone"

# The four chapters a flight has in the app. FLY is the core, filled in the flight-deck cyan.
chapters:
  heading: "A flight has four chapters"
  items:
    - { key: "plan",    name: "Plan",    line: "Where, when, which aircraft, and a route the app checks as you draw it." }
    - { key: "prepare", name: "Prepare", line: "The weather, NOTAMs, the ATC flight plan and the border rules, as a list you tick." }
    - { key: "fly",     name: "Fly",     line: "One cockpit screen: the check that is due, the map or the route.", core: true }
    - { key: "close",   name: "Close",   line: "Close the ATC flight plan; the logbook line is already written." }
  story: { label: "Follow one real flight, from Bressaucourt to Samedan", href: "/flight" }

# Rows with `fly: true` sit in the FLY band, with the iPhone band (`phone`) after them.
flagship:
  heading: "A flight, start to finish"
  items:
    - step: "01 · Plan"
      anchor: "plan"
      title: "Plan the whole flight"
      description: "Tell Plan new flight when and where you are leaving from, and it sets up the flight for you. The route editor draws the profile over the terrain and lists every airspace you enter at the altitude you planned."
      facts: ["Terrain and airspace checked as you draw", "Trips with stops", "Fuel on board in one tap"]
      shot: "route"
    - step: "02 · Prepare"
      anchor: "prepare"
      where: true
      title: "Everything you would otherwise keep in your head"
      description: "Weather, NOTAMs, the ATC flight plan and the border are blocks you tick, each with its link. The line under the flight's name shows what is left to do, and by when."
      facts: ["A reminder the day before", "Border rules for six countries", "An A5 nav log for the kneeboard"]
      shot: "prepare"
    - step: "03 · Fly"
      anchor: "fly"
      fly: true
      title: "Each check opens when it's due"
      description: "AéroCheck tells you when a check is due: climb after the take-off, cruise at the level-off, approach five miles out. If you fly past a check, it stays on the list, marked overdue. Go-arounds, touch-and-goes and landings are recorded automatically (and you can undo them)."
      facts: ["Deferred items stay in view", "Hide the memory items to test yourself", "V-SPEEDS and the briefings open over the page"]
      note: "AéroCheck supports your aircraft's approved checklist and the AFM, and replaces neither: the paper checklist stays on board."
      shot: "vspeeds"
      iphone_shot: "cockpit"
    - step: "03 · Fly"
      fly: true
      where: true
      title: "The map, with the circuits drawn"
      description: "En route the page switches to the chart: the aircraft, the route and the airspace, with MARK and Divert one tap away. Around aerodromes, you also get the traffic circuits, arrival sectors and VFR routes from open flightmaps. Tap an aerodrome for its card: frequencies, official chart, and your own note on it (the one you wrote on the ground so you wouldn't have to remember)."
      facts: ["Swiss ICAO and glider charts, offline", "Circuits and VFR routes in {ofmCountries} countries", "Official chart links in {chartCountries} countries"]
      shot: "circuits"
      iphone_shot: "cockpitmap"
    - step: "Atlas"
      anchor: "atlas"
      fly: true
      where: true
      title: "Atlas: a map drawn for flying"
      description: "AéroCheck draws its own map from OpenStreetMap, with what you actually look for out of the window: towns by size, motorways and main roads, railways and cable cars, rivers, lakes and forests, glaciers, and peaks with their height in feet, over the relief. It covers every country on the Countries page (the large ones by region) and joins them at the borders."
      facts: ["Download a region and it works offline", "Rebuilt every month from OpenStreetMap", "Aerial imagery from open government sources"]
      note: "Online, the map loads what is on screen, within a monthly allowance: 1,500 tiles, or 15,000 with Pro. Downloaded regions don't count."
      shot: "atlas"
    - step: "04 · Close"
      anchor: "close"
      title: "Landed. Now the logbook."
      description: "The reminder to close your ATC flight plan comes after landing, and only if you filed one. Block and flight times come from the track, and the logbook line is drafted to EASA rules, in your logbook's own columns."
      facts: ["CSV and PDF extract", "What the flight cost", "Student mode: dual, with the instructor as PIC"]
      shot: "closeout"
      iphone_shot: "log"

phone:
  step: "03 · Fly · iPhone"
  title: "The same Cockpit on the iPhone"
  description: "Sized for a phone at arm's length: the same three pages, with a one-word label on each button. Turn it on its side and the controls move to a column, with the map beside them. Next to an iPad, the iPhone becomes a second screen that follows it, and gives a Wi-Fi-only iPad its GPS."
  shots: ["cockpitmap", "landscape"]

pricing:
  heading: "What it costs"
  tiers:
    - { name: "Free", title: "Everything, with one aircraft", text: "Every feature of the app, with the Aerospool WT9 Dynamic checklist." }
    - { name: "AéroCheck Pro", title: "Every club aircraft", text: "The checklists of the other {premium} aircraft: monthly, or yearly with a free week for eligible accounts.", highlight: true }
    - { name: "Lifetime", title: "Pay once", text: "AéroCheck Pro for good, with a single purchase through your Apple Account." }
  send: "AéroCheck started with three Swiss flying clubs, in Porrentruy, Lausanne and Neuchâtel. Clubs and pilots send us their checklists, and new aircraft are added regularly: if yours isn't there yet, send it from the app or from this site."
  links:
    - { label: "See the aircraft", href: "/aircraft" }
    - { label: "Send a checklist", href: "/send" }

faq:
  heading: "Questions"
  items:
    - q: "Does it replace my paper checklist?"
      a: "No. AéroCheck supports your aircraft's approved checklist, the AFM and your own judgement, and replaces none of them. The paper checklist stays on board."
    - q: "Is my aircraft in it?"
      a: "{total} aircraft today, most from Swiss club fleets; the Aircraft page lists them. If yours isn't there, send its checklist from the app or from aerocheck.app/send: new aircraft are added regularly."
    - q: "Does it work outside Switzerland?"
      a: "Yes. You get the airspace of the countries you fly in, traffic circuits and VFR routes in {ofmCountries} countries, and official chart links in {chartCountries}. The Swiss charts, DABS and GAFOR are Swiss extras. aerocheck.app/countries shows what works where, country by country."
    - q: "Does it work without a connection?"
      a: "Yes. Maps, airspace and aerodromes are kept on the device: download them before you fly."
    - q: "What does the iPhone add?"
      a: "Without an iPad, the iPhone runs the same Cockpit, laid out for a phone. Paired with an iPad in Companion mode, it becomes a second screen that follows the iPad's flight, and you can tick items on either device. If your iPad is a Wi-Fi-only model (so no GPS), the iPhone also gives it its position. Companion mode needs iOS 26 on both devices."
    - q: "What happens to my data?"
      a: "Your flights, tracks and aerodrome notes stay on your device and in your own iCloud. You don't need an account, and there is no advertising or tracking (the privacy policy has the details)."

also:
  label: "Also"
  items: ["Apple Watch", "Companion mode, iPad and iPhone together", "Landing-fee links for {tariffs} aerodromes", "Day, night and sunlight contrast", "Set in B612, the Airbus cockpit typeface", "Accessibility", "Open source (MIT) on GitHub"]

# The story page (/flight): one real flight, Bressaucourt to Samedan in F-HVXA, captured from its own track.
story:
  meta:
    title: "One flight"
    description: "A real flight across the Alps, from Bressaucourt to Samedan in a WT9 Dynamic, from the evening before to the logbook line, with AéroCheck on the kneeboard."
  eyebrow: "One flight · Bressaucourt to Samedan · F-HVXA"
  title: "The checklist that follows your flight."
  subtitle: "A real flight across the Alps in a WT9 Dynamic, from the evening before to the logbook line, with AéroCheck on the kneeboard."
  secondary: { label: "Back to the features", href: "/#features" }
  prologue:
    band: "DRY RUN · 4×"
    title: "Before your first flight with it, fly one on the ground."
    text: "Once the app is installed: a guided flight in four parts, from planning to the logbook, in the real Cockpit, from your desk. After that, free practice: circuits at any aerodrome, a go-around on the second final. None of it ends up in your logbook."
    link: { label: "How the dry run works", href: "/manual#dry-run" }
    shot: "dryrun"
    alt: "A guided dry run on its first final, on an iPad"
  moments:
    - when: "The evening before"
      sub: "At home"
      chapter: "Plan"
      title: "Draw the route, see what it crosses."
      text: "Bressaucourt to Samedan over the Grimsel and the Furka: 26 waypoints, 173 NM, 1 h 47. The profile shows the terrain under the planned altitudes, and the editor lists every airspace the route enters."
      shot: "route"
      alt: "The route editor, Bressaucourt to Samedan"
    - when: "The morning"
      sub: "Before leaving"
      chapter: "Prepare"
      title: "One block left: the NOTAMs."
      text: "Weather and GAFOR, NOTAMs and the DABS, the ATC flight plan, the nav log: each one is a block with its links and a single tick. The line under the title shows what's left, then ready once you're done."
      shot: "prepare"
      alt: "The flight's page, NOTAMs and airspace still to do"
    - when: "0:06"
      sub: "Lined up, runway 07"
      chapter: "Fly"
      fly: true
      title: "Line-up check done. The climb check opens after the take-off."
      text: "Every check so far, one item at a time. On the runway, NEXT points at DEKAM and the button reads AFTER TAKE-OFF: the climb check opens as soon as the app detects the take-off."
      shot: "lineup"
      alt: "The Cockpit lined up at Bressaucourt"
    - when: "0:22"
      sub: "Over Lake Biel"
      chapter: "Fly"
      fly: true
      title: "Waypoints are marked automatically."
      text: "The app marks BENOT as you pass it, and UNDO stays there for six seconds. Bern's zone is a few minutes ahead: its tower was due in NEXT, you tapped it, and it became NOW. Zürich Info is next, for when you leave the zone."
      shot: "automark"
      alt: "BENOT marked automatically, the cruise check open, Bern's tower NOW"
    - when: "1:40"
      sub: "Towards the Julier"
      chapter: "Fly"
      fly: true
      title: "The chart, the route and the next pass."
      text: "With the cruise check done, the page switches to the map: the route over the passes, the next waypoint and its time, plus MARK and the leg timer at the bottom of the screen. Four minutes out, AIRSPACE AHEAD names the FIZ of Samedan."
      shot: "alps"
      alt: "The Cockpit's map on the way to the Julier, AIRSPACE AHEAD naming the FIZ of Samedan"
    - when: "1:44"
      sub: "Over St. Moritz"
      chapter: "Fly"
      fly: true
      title: "The approach check opens when you need it."
      text: "Descending into the Engadine, the approach check opens automatically: the check slot turns amber, with six items to go. NOW is Samedan Info, and NEXT is empty (you are almost there). On the Atlas, the FIZ of Samedan is a minute ahead, with its limits on the map."
      shot: "approach"
      alt: "The approach check near Samedan"
    - when: "Engine off"
      sub: "Samedan"
      chapter: "Close"
      title: "Close the flight plan. The logbook line is already written."
      text: "The reminder to close the ATC flight plan stays red until you mark it closed, with skyguide ARO's number on it. Block and flight times come from the track, and the engine hours from the two readings you typed in."
      shot: "closeout"
      alt: "Closing out the flight at Samedan"
    - when: "Later"
      sub: "In the logbook"
      chapter: "Close"
      title: "The whole flight, in the logbook."
      text: "The track over the Alps, the altitude profile, every event of the timeline with its time, and the line for your paper logbook."
      shot: "log"
      alt: "The flight in the logbook"
  end:
    title: "Your next flight, on your kneeboard."
    text: "The WT9 Dynamic is free. Every club aircraft comes with AéroCheck Pro."
    secondary: { label: "Read the manual", href: "/manual" }


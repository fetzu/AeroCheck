name: "CodeQL"

# Only what ships is scanned: each push to main (a merge) and each release tag. No pull request runs, no weekly
# run: every PR of a stack took a macOS runner for a build main gets anyway (the author, 25 Oct 2026). A newer push
# to main cancels a main run still queued or running; a tag's run is its own. Main runs only when something CodeQL
# analyses changed (Swift sources, the Xcode project, the build settings, this file); a tag always runs (GitHub
# doesn't apply path filters to tags). "Run workflow" in Actions starts one by hand.
on:
  push:
    branches: [main]
    tags: ['*']
    paths:
      - '**/*.swift'
      - 'AeroCheck.xcodeproj/**'
      - '**/*.xcconfig'
      - '.github/workflows/codeql.yml'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-26
    permissions:
      # SEC-C42: least privilege, stated explicitly rather than inherited.
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: swift
          build-mode: manual

      - name: Build with xcodebuild
        run: |
          xcodebuild build \
            -scheme "AéroCheck" \
            -destination "generic/platform=iOS" \
            -skipPackagePluginValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCH=arm64

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:swift"

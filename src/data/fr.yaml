lang: "fr"
meta:
  title: "AéroCheck · L'app de checklists pour les pilotes VFR"
  description: "Une app de checklists pour les pilotes VFR, sur l'iPad fixé à votre planchette ou sur votre iPhone. Elle suit votre vol de la vérification prévol à l'arrêt moteur, indique quelle vérification est à faire, et garde la carte, la route et le carnet à portée de main. Gratuite pour un avion."
brand: "AéroCheck"

nav:
  features: "Fonctionnalités"
  story: "Un vol"
  aircraft: "Aéronefs"
  countries: "Pays"
  manual: "Manuel"
  changelog: "Journal"
  download: "Télécharger"

# Le badge App Store : le visuel d'Apple (public/assets/badges), le lien dans src/lib/site.ts (APP_STORE_URL).
store: { alt: "Télécharger AéroCheck dans l'App Store", cta: "Télécharger AéroCheck" }
# Le bouton clair/sombre de la barre : ce que fait un toucher.
theme: { to_dark: "Passer au thème sombre", to_light: "Passer au thème clair" }

hero:
  eyebrow: "Pour les pilotes VFR · iPad et iPhone"
  title: "Conçu pour la planchette."
  subtitle: "AéroCheck est une app de checklists pour les pilotes VFR. Elle suit votre vol de la vérification prévol à l'arrêt moteur, ouvre la vérification à faire, et garde la carte, la route et le carnet à portée de main. Gratuite pour un avion."
  secondary: { label: "Suivre un vol réel", href: "/fr/flight" }
  facts: "16 phases · {total} avions · français, allemand et anglais · open source"
  shot: "cockpit"
  shot_alt: "Le cockpit en croisière sur un iPad"
  callouts:
    - { side: "left", x: 2.5, y: 5.0,  where: "En haut",        title: "Où vous en êtes",      text: "La vérification en cours, le temps de vol et le GPS." }
    - { side: "right", x: 97, y: 13.4, where: "Juste dessous",  title: "Vos paramètres de vol",  text: "Vitesse sol, altitude, route, et ce qu'il reste jusqu'au prochain point." }
    - { side: "left", x: 2.5, y: 23.6, where: "Sous les chiffres", title: "Qui appeler",      text: "La fréquence à utiliser maintenant, et la suivante." }
    - { side: "right", x: 97, y: 56.6, where: "Au milieu",      title: "L'élément en cours",   text: "Encadré dans la liste, avec les autres éléments autour." }
    - { side: "left", x: 2.5, y: 93.8, where: "En bas",         title: "Quatre boutons",       text: "À la même place dans chaque phase (pour ne pas avoir à les chercher)." }

dryrun:
  band: "VOL À BLANC · 4×"
  title: "Votre premier vol avec AéroCheck, au sol."
  text: "Une fois l'app sur votre iPad ou votre iPhone, le vol à blanc vous fait faire tout un vol depuis votre bureau : une histoire guidée en quatre parties, de la préparation au carnet, dans le vrai cockpit. Ensuite, la pratique libre : des tours de piste sur tout aérodrome doté d'une piste, ou l'une de vos routes. Aucun de ces vols ne finit dans votre carnet, et vous n'avez même pas à quitter votre chaise."
  link: { label: "Comment marche le vol à blanc", href: "/manual#vol-à-blanc" }
  shot: "dryrun"
  alt: "Un vol à blanc guidé en première finale, sur un iPhone"

# Les quatre chapitres d'un vol dans l'app. VOLER est le cœur, rempli du cyan du poste de pilotage.
chapters:
  heading: "Un vol, quatre chapitres"
  items:
    - { key: "plan",    name: "Planifier", line: "Où, quand, quel avion, et une route que l'app vérifie pendant que vous la tracez." }
    - { key: "prepare", name: "Préparer",  line: "La météo, les NOTAM, le plan de vol ATC et les formalités de frontière, en liste à cocher." }
    - { key: "fly",     name: "Voler",     line: "Un seul écran de cockpit : la vérification à faire, la carte ou la route.", core: true }
    - { key: "close",   name: "Clôturer",  line: "Clôturer le plan de vol ATC ; la ligne du carnet est déjà écrite." }
  story: { label: "Suivre un vrai vol, de Bressaucourt à Samedan", href: "/flight" }

# Les rangées `fly: true` forment la bande VOLER, suivie de la bande iPhone (`phone`).
flagship:
  heading: "Un vol, du début à la fin"
  items:
    - step: "01 · Planifier"
      anchor: "plan"
      title: "Planifier tout le vol"
      description: "Dans Planifier un vol, indiquez quand et d'où vous partez : l'app prépare le vol pour vous. L'éditeur de route trace le profil au-dessus du relief et liste chaque espace aérien où vous entrez à l'altitude prévue."
      facts: ["Relief et espaces aériens vérifiés pendant le tracé", "Des voyages avec escales", "Le carburant à bord en un toucher"]
      shot: "route"
    - step: "02 · Préparer"
      anchor: "prepare"
      where: true
      title: "Tout ce qu'il faudrait sinon garder en tête"
      description: "La météo, les NOTAM, le plan de vol ATC et la frontière sont des blocs à cocher, chacun avec son lien. La ligne sous le nom du vol indique ce qu'il reste à faire, et pour quand."
      facts: ["Un rappel la veille", "Les formalités de frontière de six pays", "Un log de nav A5 pour la planchette"]
      shot: "prepare"
    - step: "03 · Voler"
      anchor: "fly"
      fly: true
      title: "Chaque vérification s'ouvre au bon moment"
      description: "AéroCheck vous indique quand une vérification est à faire : la montée après le décollage, la croisière à la mise en palier, l'approche à cinq milles. Si vous passez une vérification sans la faire, elle reste dans la liste, marquée en retard. Les remises de gaz, posés-décollés et atterrissages sont enregistrés automatiquement (et vous pouvez les annuler)."
      facts: ["Les éléments reportés restent en vue", "Masquer les éléments mémoire pour vous tester", "V-SPEEDS et les briefings s'ouvrent par-dessus la page"]
      note: "AéroCheck accompagne la checklist approuvée de votre avion et l'AFM, et ne remplace ni l'une ni l'autre : la checklist papier reste à bord."
      shot: "vspeeds"
      iphone_shot: "cockpit"
    - step: "03 · Voler"
      fly: true
      where: true
      title: "La carte, avec les tours de piste"
      description: "En route, la page passe à la carte : l'avion, la route et les espaces aériens, avec MARQUER et Dérouter à portée de main. Autour des aérodromes, vous avez aussi les tours de piste, les secteurs d'arrivée et les routes VFR d'open flightmaps. Touchez un aérodrome pour ouvrir sa fiche : fréquences, carte officielle et votre propre note sur cet aérodrome (celle que vous avez écrite au sol pour ne pas avoir à vous en souvenir)."
      facts: ["Cartes OACI et vol à voile suisses, hors ligne", "Tours de piste et routes VFR dans {ofmCountries} pays", "Liens vers les cartes officielles dans {chartCountries} pays"]
      shot: "circuits"
      iphone_shot: "cockpitmap"
    - step: "Atlas"
      anchor: "atlas"
      fly: true
      where: true
      title: "Atlas : une carte dessinée pour le vol"
      description: "AéroCheck dessine sa propre carte à partir d'OpenStreetMap, avec ce que vous cherchez vraiment par la fenêtre : les villes selon leur taille, autoroutes et routes principales, voies ferrées et téléphériques, rivières, lacs et forêts, glaciers, et les sommets avec leur altitude en pieds, sur le relief. Elle couvre chaque pays de la page Pays (les grands par région) et les raccorde aux frontières."
      facts: ["Téléchargez une région : elle fonctionne hors ligne", "Reconstruite chaque mois depuis OpenStreetMap", "Images aériennes de sources publiques ouvertes"]
      note: "En ligne, la carte charge ce qui est à l'écran, dans la limite d'un quota mensuel : 1 500 tuiles, ou 15 000 avec Pro. Les régions téléchargées ne comptent pas."
      shot: "atlas"
    - step: "04 · Clôturer"
      anchor: "close"
      title: "Posé. Place au carnet."
      description: "Le rappel de clôturer votre plan de vol ATC arrive après l'atterrissage, et seulement si vous en avez déposé un. Les heures bloc et de vol viennent de la trace, et la ligne du carnet est rédigée selon les règles de l'EASA, dans les colonnes de votre propre carnet."
      facts: ["Export CSV et extrait PDF", "Ce que le vol a coûté", "Mode élève-pilote : double commande, l'instructeur comme commandant de bord"]
      shot: "closeout"
      iphone_shot: "log"

phone:
  step: "03 · Voler · iPhone"
  title: "Le même cockpit sur l'iPhone"
  description: "Dimensionné pour un téléphone à bout de bras : les mêmes trois pages, avec un mot sur chaque bouton. Tournez-le sur le côté : les commandes passent dans une colonne, avec la carte à côté. Associé à un iPad, l'iPhone devient un second écran qui le suit, et fournit le GPS à un iPad Wi-Fi."
  shots: ["cockpitmap", "landscape"]

pricing:
  heading: "Ce que ça coûte"
  tiers:
    - { name: "Gratuit", title: "Tout, pour un avion", text: "Toutes les fonctions de l'app, avec la checklist de l'Aerospool WT9 Dynamic." }
    - { name: "AéroCheck Pro", title: "Tous les avions de club", text: "Les checklists des {premium} autres avions : au mois, ou à l'année avec une semaine d'essai gratuite pour les comptes éligibles.", highlight: true }
    - { name: "À vie", title: "Un seul paiement", text: "AéroCheck Pro à vie, en un achat unique via votre compte Apple." }
  send: "AéroCheck a commencé avec trois aéroclubs suisses, à Porrentruy, Lausanne et Neuchâtel. Les clubs et les pilotes nous envoient leurs checklists, et de nouveaux avions s'ajoutent régulièrement : si le vôtre n'y est pas encore, envoyez sa checklist depuis l'app ou depuis ce site."
  links:
    - { label: "Voir les avions", href: "/aircraft" }
    - { label: "Envoyer une checklist", href: "/send" }

faq:
  heading: "Questions"
  items:
    - q: "AéroCheck remplace-t-il ma checklist papier ?"
      a: "Non. AéroCheck accompagne la checklist approuvée de votre avion, l'AFM et votre propre jugement, et ne remplace aucun des trois. La checklist papier reste à bord."
    - q: "Mon avion est-il dans la liste ?"
      a: "{total} avions aujourd'hui, pour la plupart de flottes de clubs suisses ; la page Aéronefs les liste. Si le vôtre manque, envoyez sa checklist depuis l'app ou depuis aerocheck.app/fr/send : de nouveaux avions s'ajoutent régulièrement."
    - q: "Fonctionne-t-il hors de Suisse ?"
      a: "Oui. Vous avez les espaces aériens des pays où vous volez, les tours de piste et routes VFR dans {ofmCountries} pays, et les liens vers les cartes officielles dans {chartCountries}. Les cartes suisses, le DABS et le GAFOR sont des plus propres à la Suisse. aerocheck.app/fr/countries indique ce qui est disponible, pays par pays."
    - q: "Fonctionne-t-il sans connexion ?"
      a: "Oui. Cartes, espaces aériens et aérodromes restent sur l'appareil : téléchargez-les avant de voler."
    - q: "Qu'apporte l'iPhone ?"
      a: "Sans iPad, l'iPhone offre le même cockpit, adapté à l'écran d'un téléphone. Associé à un iPad en mode compagnon, il devient un second écran qui suit le vol de l'iPad, et vous pouvez cocher les éléments sur l'un comme sur l'autre. Si votre iPad est un modèle Wi-Fi (donc sans GPS), l'iPhone lui donne aussi sa position. Le mode compagnon demande iOS 26 sur les deux appareils."
    - q: "Que deviennent mes données ?"
      a: "Vos vols, vos traces et vos notes d'aérodrome restent sur votre appareil et dans votre propre iCloud. Vous n'avez pas besoin de compte, et il n'y a ni publicité ni pistage (la politique de confidentialité donne le détail)."

also:
  label: "Aussi"
  items: ["Apple Watch", "Mode compagnon, iPad et iPhone ensemble", "Liens vers les taxes d'atterrissage de {tariffs} aérodromes", "Jour, nuit et contraste au soleil", "Composé en B612, la police des cockpits Airbus", "Accessibilité", "Open source (MIT) sur GitHub"]

# La page du vol (/fr/flight) : un vrai vol, de Bressaucourt à Samedan sur F-HVXA, capturé à partir de sa propre trace.
story:
  meta:
    title: "Un vol"
    description: "Un vrai vol à travers les Alpes, de Bressaucourt à Samedan en WT9 Dynamic, de la veille à la ligne du carnet, avec AéroCheck sur la planchette."
  eyebrow: "Un vol · de Bressaucourt à Samedan · F-HVXA"
  title: "La checklist qui suit votre vol."
  subtitle: "Un vrai vol à travers les Alpes en WT9 Dynamic, de la veille à la ligne du carnet, avec AéroCheck sur la planchette."
  secondary: { label: "Retour aux fonctionnalités", href: "/#features" }
  prologue:
    band: "VOL À BLANC · 4×"
    title: "Avant votre premier vol avec AéroCheck, faites-en un au sol."
    text: "Une fois l'app installée : un vol guidé en quatre parties, de la préparation au carnet, dans le vrai cockpit, depuis votre bureau. Ensuite, la pratique libre : des tours de piste sur tout aérodrome, une remise de gaz en deuxième finale. Aucun de ces vols ne finit dans votre carnet."
    link: { label: "Comment marche le vol à blanc", href: "/manual#vol-à-blanc" }
    shot: "dryrun"
    alt: "Un vol à blanc guidé en première finale, sur un iPad"
  moments:
    - when: "La veille"
      sub: "À la maison"
      chapter: "Planifier"
      title: "Tracer la route, voir ce qu'elle traverse."
      text: "De Bressaucourt à Samedan par le Grimsel et la Furka : 26 points, 173 NM, 1 h 47. Le profil montre le relief sous les altitudes prévues, et l'éditeur liste chaque espace aérien que la route traverse."
      shot: "route"
      alt: "L'éditeur de route, de Bressaucourt à Samedan"
    - when: "Le matin"
      sub: "Avant de partir"
      chapter: "Préparer"
      title: "Dix sur douze, et les NOTAM encore à lire."
      text: "La météo, le DABS, le GAFOR, les formalités de frontière pour la France et l'Italie, le plan de vol ATC : chacun est une tâche avec son lien, à cocher au fur et à mesure. L'anneau n'affiche prêt que lorsque les douze sont faites."
      shot: "prepare"
      alt: "La page du vol, 10 sur 12 faites"
    - when: "0:16"
      sub: "Aligné, piste 07"
      chapter: "Voler"
      fly: true
      title: "Alignement fait. La vérification de montée s'ouvre après le décollage."
      text: "Toutes les vérifications jusqu'ici, un élément à la fois. Sur la piste, SUIVANT désigne DEKAM et le bouton affiche APRÈS LE DÉCOLLAGE : la vérification de montée s'ouvre dès que l'app détecte le décollage."
      shot: "lineup"
      alt: "Le cockpit aligné à Bressaucourt"
    - when: "0:21"
      sub: "Au-dessus du lac de Bienne"
      chapter: "Voler"
      fly: true
      title: "Les points tournants sont marqués automatiquement."
      text: "L'app marque BENOT à votre passage, et Annuler reste affiché six secondes. La zone de Berne est à quelques minutes : sa tour était à contacter en SUIV, vous l'avez touchée et elle est passée en ACT. Zürich Info vient ensuite, pour la sortie de zone."
      shot: "automark"
      alt: "BENOT marqué automatiquement, la vérification de croisière ouverte, la tour de Berne en ACT"
    - when: "1:04"
      sub: "En montée vers le Grimsel"
      chapter: "Voler"
      fly: true
      title: "La carte, la route et le col suivant."
      text: "En croisière, la page passe à la carte : la route par-dessus les cols, le prochain point et son heure, avec MARQUER et le chrono en bas de l'écran."
      shot: "alps"
      alt: "La carte du cockpit au-dessus des Alpes"
    - when: "1:53"
      sub: "Au-dessus de Saint-Moritz"
      chapter: "Voler"
      fly: true
      title: "La vérification d'approche s'ouvre au moment voulu."
      text: "En descente vers l'Engadine, la vérification d'approche s'ouvre automatiquement : la case de vérification passe à l'ambre, avec six éléments à faire. ACT est la tour de Samedan, et SUIV est vide (vous y êtes presque)."
      shot: "approach"
      alt: "La vérification d'approche près de Samedan"
    - when: "Moteur coupé"
      sub: "Samedan"
      chapter: "Clôturer"
      title: "Clôturer le plan de vol. La ligne du carnet est déjà écrite."
      text: "Le rappel de clôturer le plan de vol ATC reste rouge tant que ce n'est pas fait. Les heures bloc et de vol viennent de la trace, et les heures moteur des deux relevés d'horamètre que vous avez saisis."
      shot: "closeout"
      alt: "La clôture du vol à Samedan"
    - when: "Plus tard"
      sub: "Dans le carnet"
      chapter: "Clôturer"
      title: "Tout le vol, dans le carnet."
      text: "La trace au-dessus des Alpes, le profil d'altitude, chaque événement de la chronologie avec son heure, et la ligne pour votre carnet papier."
      shot: "log"
      alt: "Le vol dans le carnet"
  end:
    title: "Votre prochain vol, sur votre planchette."
    text: "Le WT9 Dynamic est gratuit. Tous les avions de club sont inclus dans AéroCheck Pro."
    secondary: { label: "Lire le manuel", href: "/manual" }


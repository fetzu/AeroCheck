# Feature List - Based on AeroCheck capabilities
features                                  :

  - title                                 : 16 Flight Phases
    description                           : Complete coverage from Preflight to Hangar. Navigate through all phases with step-by-step checklist guidance.
    fontawesome_icon_name                 : list-check

  - title                                 : Multi-Aircraft Support
    description                           : Supports WT9 Dynamic and PA-28-181 Archer II with aircraft-specific checklists and procedures.
    fontawesome_icon_name                 : plane

  - title                                 : GPS Tracking
    description                           : Records your flight path with real-time ground speed and altitude display. Export to GPX for analysis.
    fontawesome_icon_name                 : location-arrow

  - title                                 : Interactive Navigation
    description                           : Full-screen map view with Swiss ICAO charts, swisstopo maps, and offline caching for areas without signal.
    fontawesome_icon_name                 : map

  - title                                 : Learning Mode
    description                           : Hide memorizable checklist items to test your knowledge. Perfect for pilot students preparing for checkrides.
    fontawesome_icon_name                 : graduation-cap

  - title                                 : Flight Logging
    description                           : Automatic timing of engine start, line-up, landing, and shutdown. Export flights as GPX, JSON, or ZIP.
    fontawesome_icon_name                 : clock

  - title                                 : Dark Cockpit UI
    description                           : Designed for readability in the cockpit with large touch targets and aviation-inspired colors.
    fontawesome_icon_name                 : moon

  - title                                 : Offline Ready
    description                           : Cache Swiss ICAO charts for offline use. Essential for flights over areas with limited cellular coverage.
    fontawesome_icon_name                 : wifi-slash

  - title                                 : Open Source
    description                           : Built with Swift and SwiftUI. Contribute on GitHub or adapt it for your own aeroclub.
    fontawesome_icon_name                 : code-branch




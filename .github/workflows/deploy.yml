name: Deploy website (Astro → Pages)

# Builds the Astro site and deploys it to GitHub Pages.
#
# NOT YET LIVE: this is workflow_dispatch-only on purpose. The live site is still served by
# Jekyll from the gh-pages branch. To go live:
#   1. Settings → Pages → Build and deployment → Source → "GitHub Actions".
#   2. Add a push trigger here (e.g. on: push: branches: [website]) — or merge this branch to
#      whatever you make the site's production branch — and run it.
# Until step 1 is done, deploy-pages would fail, so we keep it manual.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
